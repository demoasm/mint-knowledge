name: Deploy lightweight server
on:
  workflow_dispatch:
    inputs:
      version:
        description: Full 40-character commit SHA of existing TCB images (including rollback)
        required: true
      components:
        description: Comma-separated services to update (app,frontend,docreader)
        default: app,frontend
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: mint-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      COMPONENTS: ${{ inputs.components }}
      VERSION: ${{ inputs.version }}
      TCB_PASSWORD: ${{ secrets.TCB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy selected TCB release
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPONENTS" =~ ^(app|frontend|docreader)(,(app|frontend|docreader))*$ ]]
          source deploy/cloud/ssh-client.sh
          printf '%s\n' "$TCB_PASSWORD" | timeout 1000 "${SSH[@]}" "$REMOTE" "tcb $VERSION $COMPONENTS"
