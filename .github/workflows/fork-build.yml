name: Build Mint images
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: Components to rebuild; auto selects changes since the last deployment
        type: choice
        default: auto
        options: [auto, app, frontend, docreader, 'app,frontend', 'app,frontend,docreader']
permissions:
  contents: read
  packages: write
concurrency:
  group: mint-main-delivery
  cancel-in-progress: false
jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      components: ${{ steps.changes.outputs.components }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test component selection and deployment protocol
        run: |
          python3 -m unittest discover -s deploy/cloud -p 'test_*.py'
          sudo bash deploy/cloud/test_deploy.sh
      - id: changes
        env:
          REQUESTED_COMPONENTS: ${{ inputs.components || 'auto' }}
        run: |
          set -euo pipefail
          source deploy/cloud/ssh-client.sh
          base=$(timeout 30 "${SSH[@]}" "$REMOTE" status)
          python3 deploy/cloud/select-components.py "$base" "$GITHUB_SHA" "$REQUESTED_COMPONENTS" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Tencent TCB registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: '100006345097'
          password: ${{ secrets.TCB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/demoasm/mint-knowledge-${{ matrix.component }}:${{ github.sha }}
            ccr.ccs.tencentyun.com/tcb-100006345097-fwhd/git:${{ matrix.component }}-${{ github.sha }}
          cache-from: type=gha,scope=fork-${{ matrix.component }}
          cache-to: type=gha,scope=fork-${{ matrix.component }},mode=max
          build-args: |
            GOPROXY_ARG=https://proxy.golang.org,direct
            APK_MIRROR_ARG=
  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: mint-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      COMPONENTS: ${{ needs.changes.outputs.components }}
      TCB_PASSWORD: ${{ secrets.TCB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy selected images from Tencent TCB
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skip superseded automatic deployment: $GITHUB_SHA (main is $latest)"
            exit 0
          fi
          source deploy/cloud/ssh-client.sh
          printf '%s\n' "$TCB_PASSWORD" | timeout 1000 "${SSH[@]}" "$REMOTE" "tcb $GITHUB_SHA $COMPONENTS"
