name: Build and deploy on server
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: Components to rebuild; auto selects changes since the last deployment
        type: choice
        default: auto
        options: [auto, app, frontend, docreader, 'app,frontend', 'app,frontend,docreader']
permissions:
  contents: read
concurrency:
  group: mint-main-delivery
  cancel-in-progress: false
jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      components: ${{ steps.changes.outputs.components }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test component selection and deployment protocol
        run: |
          python3 -m unittest discover -s deploy/cloud -p 'test_*.py'
          sudo bash deploy/cloud/test_deploy.sh
      - id: changes
        env:
          REQUESTED_COMPONENTS: ${{ inputs.components || 'auto' }}
        run: |
          set -euo pipefail
          source deploy/cloud/ssh-client.sh
          base=$(timeout 30 "${SSH[@]}" "$REMOTE" status)
          python3 deploy/cloud/select-components.py "$base" "$GITHUB_SHA" "$REQUESTED_COMPONENTS" >> "$GITHUB_OUTPUT"
  deploy:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency:
      group: mint-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      COMPONENTS: ${{ needs.changes.outputs.components }}
      TCB_PASSWORD: ${{ secrets.TCB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build selected components on server, back up to TCB and deploy
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skip superseded automatic deployment: $GITHUB_SHA (main is $latest)"
            exit 0
          fi
          source deploy/cloud/ssh-client.sh
          printf '%s\n' "$TCB_PASSWORD" | timeout 7000 "${SSH[@]}" "$REMOTE" "build $GITHUB_SHA $COMPONENTS"
